# Path dari root repo. Jangan isi Base directory di UI Netlify
# (kalau base = frontend, publish frontend/dist jadi path dobel).

[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  PUPPETEER_SKIP_DOWNLOAD = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
